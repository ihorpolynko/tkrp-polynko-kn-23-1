apiVersion: v1
kind: Secret
metadata:
  name: courses-secret
  namespace: courses-lab
type: Opaque
stringData:
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: apppassword
  PYTHON_DATABASE_URL: postgresql+psycopg://appuser:apppassword@postgres-service:5432/courses
  DOTNET_CONNECTION_STRING: Host=postgres-service;Port=5432;Database=courses;Username=appuser;Password=apppassword