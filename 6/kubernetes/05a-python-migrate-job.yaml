apiVersion: batch/v1
kind: Job
metadata:
  name: python-migrate
  namespace: courses-lab
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ihorpolynko/courses-api-python:1.0
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: courses-secret
                  key: PYTHON_DATABASE_URL